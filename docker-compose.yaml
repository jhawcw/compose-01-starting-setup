# version keyword is obselete already
# version: "3.8"
name: "best-app-ever"
services:
  mongodb:
    image: "mongo"
    volumes:
      - data:/data/db
    # environment:
    # - MONGO_INITDB_ROOT_USERNAME=max
    # - MONGO_INITDB_ROOT_PASSWORD=secret
    env_file:
      - ./env/mongo.env
    networks:
      - goals-net

  backend:
    build:
      ./backend
      # context: ./backend
      # dockerfile: Dockerfile
    # image: "goals-node"
    ports:
      - "80:80"
    networks:
      - goals-net
    volumes:
      - logs:/app/logs
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGODB_USERNAME=max
      - MONGODB_PASSWORD=secret
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - goals-net
    stdin_open: true
    tty: true
    depends_on:
      - backend
      - mongodb
volumes:
  data:
  logs:
networks:
  goals-net:
